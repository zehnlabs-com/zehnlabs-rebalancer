{% extends "base.html" %}{% block content %}<h1>Work Items</h1><table><thead><tr><th>Account</th><th>Action</th><th>Source</th><th>Status</th><th>Execute at</th></tr></thead><tbody>{% for item in items %}<tr><td><a href="/work/{{ item.work_id }}">{{ item.account_id }}</a></td><td>{{ item.action }}</td><td>{{ item.source }}</td><td>{{ item.status }}</td><td>{{ item.execute_at|eastern_time }}</td></tr>{% else %}<tr><td colspan="5">No Work Items.</td></tr>{% endfor %}</tbody></table>{% endblock %}
