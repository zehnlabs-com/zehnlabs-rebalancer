x-system-version: &system-version "3.0.0"

volumes:
  ib_settings:
  rebalancer_state:

networks:
  ibkr-network:
    driver: bridge

services:
  ibkr-gateway:
    image: gnzsnz/ib-gateway:10.51.1e@sha256:85975f493bcacc8341cb42e6946c460868d165e5f64d9924b1958c8f03e7bee4
    pre_start:
      - command: ["sh", "-c", "chown -R 1000:1000 /home/ibgateway/tws_settings"]
        user: "0:0"
    ports:
      - "127.0.0.1:${IB_LIVE_API_PORT:-4001}:4003"
      - "127.0.0.1:${IB_PAPER_API_PORT:-4002}:4004"
      - "${VNC_BIND_ADDRESS:-127.0.0.1}:${VNC_PORT:-5900}:5900"
    environment:
      TWS_USERID: ${IB_USERNAME}
      TWS_PASSWORD: ${IB_PASSWORD}
      TWS_USERID_PAPER: ${IB_USERNAME}
      TWS_PASSWORD_PAPER: ${IB_PASSWORD}
      TWOFA_DEVICE: IB Key
      TRADING_MODE: ${TRADING_MODE:-paper}
      TWS_SETTINGS_PATH: /home/ibgateway/tws_settings
      READ_ONLY_API: no
      BYPASS_WARNING: yes
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-10:00 PM}
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: yes
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD:-password}
      TIME_ZONE: America/New_York
      TZ: America/New_York
      JAVA_HEAP_SIZE: 1024
    volumes:
      - ib_settings:/home/ibgateway/tws_settings
    networks:
      - ibkr-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    restart: unless-stopped

  rebalancer:
    build:
      context: .
      dockerfile: ./rebalancer/Dockerfile
      args:
        VERSION: *system-version
    environment:
      PORT: "18778"
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_VERSION: *system-version
      TRADING_MODE: ${TRADING_MODE:-paper}
      IB_HOST: ibkr-gateway
      ALLOCATIONS_BASE_URL: ${ALLOCATIONS_BASE_URL:-https://workers.fintech.zehnlabs.com/api/v1/strategies}
      ZEHNLABS_API_KEY: ${ZEHNLABS_API_KEY}
      USER_NOTIFICATIONS_ENABLED: ${USER_NOTIFICATIONS_ENABLED:-false}
      USER_NOTIFICATIONS_CHANNEL: ${USER_NOTIFICATIONS_CHANNEL:-}
      TZ: America/New_York
    volumes:
      - rebalancer_state:/app/state
    ports:
      - "127.0.0.1:18778:18778"
    depends_on:
      - ibkr-gateway
    networks:
      - ibkr-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    restart: unless-stopped
